name: Frontend DevSecOps CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  frontend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'frontend'
          path: 'frontend'
          format: 'HTML'
          args: >
            --failOnCVSS 8
            --enableRetired

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker CLI for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Frontend Docker Image
        run: |
          IMAGE_URI="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/frontend-repo/frontend:${{ github.run_number }}"
          docker build -t "$IMAGE_URI" ./frontend
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # ─── 1. Trivy Container Vulnerability Scan (Outputs JSON) ───
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      # ─── 2. Print Detailed Vulnerability Breakdown in Runner Logs ───
      - name: Print Vulnerabilities
        run: |
          echo "=================== DETECTED VULNERABILITIES ==================="
          jq '.Results[]?.Vulnerabilities[]? | {PkgName, InstalledVersion, Severity, Title}' trivy-results.json || echo "No vulnerabilities found or invalid JSON"
          echo "================================================================"

      # ─── 3. Checklist Evaluation & Security Gate ───
      - name: Vulnerability Threshold Checklist & Gate
        run: |
          echo "### 🛡️ Security Vulnerability Gate Checklist" >> $GITHUB_STEP_SUMMARY

          # Count vulnerabilities by severity
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json 2>/dev/null || echo 0)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json 2>/dev/null || echo 0)

          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
          SEVERE=$((CRITICAL + HIGH))

          if [ "$TOTAL" -gt 0 ]; then
            RATIO=$(( (SEVERE * 100) / TOTAL ))
          else
            RATIO=0
          fi

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 LOW | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "| **CRITICAL + HIGH RATIO** | **${RATIO}%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Rejection condition: CRITICAL > 0, OR (TOTAL >= 5 and RATIO > 50%)
          if [ "$CRITICAL" -gt 0 ] || { [ "$TOTAL" -ge 5 ] && [ "$RATIO" -gt 50 ]; }; then
            echo "❌ **CHECKLIST FAILED: REJECTED**" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Critical + High ratio (${RATIO}%) or Critical count ($CRITICAL) exceeds allowed threshold" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Approved for push and deployment" >> $GITHUB_STEP_SUMMARY
            echo "::error::Vulnerability threshold exceeded: Critical=$CRITICAL, High=$HIGH, Ratio=${RATIO}% (Total: $TOTAL). Rejecting build."
            exit 1
          else
            echo "✅ **CHECKLIST PASSED: APPROVED**" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Critical + High ratio (${RATIO}%) is within acceptable boundary" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Approved for push and deployment" >> $GITHUB_STEP_SUMMARY
          fi

      # ─── 4. Push Image (Only executes if gate passes) ───
      - name: Push Frontend Image to Artifact Registry
        run: docker push ${{ env.IMAGE_URI }}

      # ─── 5. Update GitOps Manifests Repository ───
      - name: Update Image Tag in GitOps Manifests Repository
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${{ secrets.GITOPS_REPO_PAT }}@github.com/${{ github.repository_owner }}/gitops-manifests.git
          cd gitops-manifests

          yq -i '.image.tag = ${{ github.run_number }}' helm/frontend/values.yaml

          git diff
          if git diff --quiet; then
            echo "No changes in values.yaml"
          else
            git commit -am "chore(frontend): update image tag to ${{ github.run_number }}"
            git push origin main
          fi
