name: Frontend DevSecOps CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  frontend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'frontend'
          path: 'frontend'
          format: 'HTML'
          args: >
            --failOnCVSS 8
            --enableRetired

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker CLI for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Frontend Docker Image
        run: |
          IMAGE_URI="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/frontend-repo/frontend:${{ github.run_number }}"
          docker build -t "$IMAGE_URI" ./frontend
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Frontend Image to Artifact Registry
        run: docker push ${{ env.IMAGE_URI }}

      - name: Update Image Tag in GitOps Manifests Repository
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${{ secrets.GITOPS_REPO_PAT }}@github.com/${{ github.repository_owner }}/gitops-manifests.git
          cd gitops-manifests

          # Updates .frontend.tag to the build number (e.g., "1", "2")
          yq -i '.image.tag = ${{ github.run_number }}' helm/frontend/values.yaml

          git diff
          if git diff --quiet; then
            echo "No changes in values.yaml"
          else
            git commit -am "chore(frontend): update image tag to ${{ github.run_number }}"
            git push origin main
          fi