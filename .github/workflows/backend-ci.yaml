name: Backend DevSecOps CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Repository
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'backend'
          path: 'backend'
          format: 'HTML'
          args: >
            --failOnCVSS 8
            --enableRetired

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker CLI for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Backend Docker Image
        run: |
          IMAGE_URI="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend-repo/backend:${{ github.run_number }}"
          docker build -t "$IMAGE_URI" ./backend
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # ── 1. Trivy Scan Output to JSON ──
      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'json'
          output: 'trivy-results.json'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      # ── 2. Security Quality Gate & Checklist Evaluation ──
      - name: Vulnerability Threshold Checklist & Gate
        run: |
          echo "### 🛡️ Security Vulnerability Gate Checklist" >> $GITHUB_STEP_SUMMARY

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json || echo 0)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json || echo 0)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json || echo 0)

          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
          SEVERE=$((CRITICAL + HIGH))

          if [ "$TOTAL" -gt 0 ]; then
            RATIO=$(( (SEVERE * 100) / TOTAL ))
          else
            RATIO=0
          fi

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 LOW | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| **TOTAL** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
          echo "| **CRITICAL + HIGH RATIO** | **${RATIO}%** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$TOTAL" -gt 0 ] && [ "$RATIO" -gt 50 ]; then
            echo "❌ **CHECKLIST FAILED: REJECTED**" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Critical + High ratio (${RATIO}%) exceeds allowed threshold (<= 50%)" >> $GITHUB_STEP_SUMMARY
            echo "- [ ] Approved for push and deployment" >> $GITHUB_STEP_SUMMARY
            echo "::error::Vulnerability threshold exceeded: Critical+High ratio is ${RATIO}% (limit: 50%). Rejecting build."
            exit 1
          else
            echo "✅ **CHECKLIST PASSED: APPROVED**" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Critical + High ratio (${RATIO}%) is within acceptable boundary (<= 50%)" >> $GITHUB_STEP_SUMMARY
            echo "- [x] Approved for push and deployment" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Push Backend Image to Artifact Registry
        run: docker push ${{ env.IMAGE_URI }}

      - name: Update Image Tag in GitOps Manifests Repository
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${{ secrets.GITOPS_REPO_PAT }}@github.com/${{ github.repository_owner }}/gitops-manifests.git
          cd gitops-manifests

          yq -i '.image.tag = ${{ github.run_number }}' helm/backend/values.yaml

          git diff
          if git diff --quiet; then
            echo "No changes in values.yaml"
          else
            git commit -am "chore(backend): bump image tag to ${{ github.run_number }}"
            git push origin main
          fi
